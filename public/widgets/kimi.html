<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .widget-container {
            position: relative;
            width: 420px;
            height: 100px;
            display: flex;
            justify-content: left;
            align-items: center;
            padding-left: 20px;
        }

        .social-card {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 0;
            padding: 0;
            border-radius: 50px;
            background: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(188, 244, 151, 0.3);
            box-shadow: 0 0 30px rgba(188, 244, 151, 0.15),
                        inset 0 0 20px rgba(188, 244, 151, 0.05);
            opacity: 0;
            transform: scale(0.8) translateX(-20px);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            overflow: hidden;
        }

        .social-card.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .social-card.exit {
            opacity: 0;
            transform: scale(0.9) translateX(-20px);
        }

        .icon-wrapper {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(188, 244, 151, 0.15);
            border: 2px solid rgba(188, 244, 151, 0.4);
            flex-shrink: 0;
            transition: all 0.4s ease;
            margin: 10px;
            margin-right: 10px;
        }

        .social-card.active .icon-wrapper {
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(188, 244, 151, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(188, 244, 151, 0); }
        }

        .icon-wrapper svg {
            width: 24px;
            height: 24px;
            fill: #BCF497;
        }

        .text-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-right: 36px;
        }

        .platform-name {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .username {
            font-size: 20px;
            font-weight: 700;
            color: #BCF497;
            letter-spacing: 0.5px;
        }

        /* Decorative corner accents */
        .corner {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 2px solid #BCF497;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .social-card.active .corner {
            opacity: 0.6;
        }

        .corner-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
        .corner-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 12px 0 0; }
        .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 12px; }
        .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 12px 0; }

        /* Scan line effect */
        .scan-line {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(188, 244, 151, 0.08), transparent);
            border-radius: 50px;
            pointer-events: none;
        }

        .social-card.active .scan-line {
            animation: scanMove 3s ease-in-out infinite;
        }

        @keyframes scanMove {
            0% { left: -50%; }
            100% { left: 150%; }
        }

        /* Progress bar at bottom */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #BCF497, transparent);
            border-radius: 3px;
            opacity: 0.7;
        }

        .social-card.active .progress-bar {
            animation: progressFill 4s linear forwards;
        }

        @keyframes progressFill {
            0% { width: 0%; opacity: 0.7; }
            90% { width: 80%; opacity: 0.7; }
            100% { width: 80%; opacity: 0; }
        }

        /* Glow dot */
        .glow-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #BCF497;
            border-radius: 50%;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
        }

        .social-card.active .glow-dot {
            opacity: 1;
            animation: glowBlink 1.5s ease-in-out infinite;
        }

        @keyframes glowBlink {
            0%, 100% { box-shadow: 0 0 4px #BCF497, 0 0 8px #BCF497; opacity: 1; }
            50% { box-shadow: 0 0 2px #BCF497, 0 0 4px #BCF497; opacity: 0.5; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="widget-container">
        <!-- Telegram -->
        <div class="social-card" data-index="0">
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>
            <div class="scan-line"></div>
            <div class="progress-bar"></div>
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
                </svg>
            </div>
            <div class="text-content">
                <span class="platform-name">Telegram</span>
                <span class="username">@mybgstrat</span>
            </div>
            <div class="glow-dot"></div>
        </div>

        <!-- TikTok -->
        <div class="social-card" data-index="1">
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>
            <div class="scan-line"></div>
            <div class="progress-bar"></div>
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>
                </svg>
            </div>
            <div class="text-content">
                <span class="platform-name">TikTok</span>
                <span class="username">@semyonhartov</span>
            </div>
            <div class="glow-dot"></div>
        </div>

        <!-- Twitch -->
        <div class="social-card" data-index="2">
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>
            <div class="scan-line"></div>
            <div class="progress-bar"></div>
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
                </svg>
            </div>
            <div class="text-content">
                <span class="platform-name">Twitch</span>
                <span class="username">twitch.tv/semyonhartov</span>
            </div>
            <div class="glow-dot"></div>
        </div>
    </div>

    <script>
        const cards = document.querySelectorAll('.social-card');
        const displayDuration = 5000;   // 4 seconds showing
        const pauseDuration = 25000;    // 30 seconds hidden
        const transitionDuration = 600;
        let currentIndex = 0;
        let isShowing = true;

        function showCard(index) {
            cards.forEach((card, i) => {
                card.classList.remove('active', 'exit');
                if (i === index) {
                    card.classList.add('active');
                }
            });
        }

        function hideCard() {
            const currentCard = cards[currentIndex];
            currentCard.classList.remove('active');
            currentCard.classList.add('exit');
            setTimeout(() => {
                currentCard.classList.remove('exit');
            }, transitionDuration);
        }

        function cycle() {
            if (isShowing) {
                // Show card
                showCard(currentIndex);
                isShowing = false;
                setTimeout(cycle, displayDuration);
            } else {
                // Hide card and pause
                hideCard();
                isShowing = true;
                currentIndex = (currentIndex + 1) % cards.length;
                setTimeout(cycle, pauseDuration);
            }
        }

        // Start
        cycle();
    </script>
</body>
</html>
